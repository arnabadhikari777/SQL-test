<!DOCTYPE html>
<html>
<head>
    <title>MySQL Users</title>
</head>
<body>

    <h1>Users From MySQL Database</h1>

    <a href="/add">
        <button>Add New User</button>
    </a>

    <br><br>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>

        {% for user in users %}
        <tr>
            <td>{{ user[0] }}</td>
            <td>{{ user[1] }}</td>
            <td>{{ user[2] }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
